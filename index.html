<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Notes App</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }

    h2 {
      margin-top: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 320px;
    }

    input {
      padding: 6px;
      font-size: 1rem;
    }

    button {
      padding: 8px;
      cursor: pointer;
    }

    #msg-register,
    #msg-login {
      margin-top: 8px;
      font-weight: bold;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f0f4ff;
      border-left: 4px solid #3748A0;
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <h1>Notes App</h1>

  <h2>Inscription</h2>
  <form id="form-register">
    <input type="email" id="reg-email" placeholder="Email" required>
    <input type="password" id="reg-password" placeholder="Mot de passe" required>
    <button type="submit">Créer un compte</button>
  </form>
  <p id="msg-register"></p>

  <h2>Connexion</h2>
  <form id="form-login">
    <input type="email" id="login-email" placeholder="Email" required>
    <input type="password" id="login-password" placeholder="Mot de passe" required>
    <button type="submit">Se connecter</button>
  </form>
  <p id="msg-login"></p>

  <h2>📝 Mes notes</h2>
  <ul id="liste-notes"></ul>

  <h2>Ajouter une note</h2>
  <input type="text" id="champ-note" placeholder="Votre note..." />
  <button onclick="ajouterNote()">Ajouter</button>

  <script>
    const API = 'http://note-app/api';

    // Appelle une route protégée en joignant le token
    async function appelerApi(route, options = {}) {
      const token = localStorage.getItem('token');

      const entetes = { 'Content-Type': 'application/json' };
      if (token) {
        entetes['Authorization'] = 'Bearer ' + token;
      }

      const reponse = await fetch(`${API}/${route}`, {
        ...options,
        headers: entetes
      });

      const data = await reponse.json();

      if (reponse.status === 401) {
        alert('Accès refusé : ' + data.erreur);
        return null;
      }
      return data;
    }

    async function chargerNotes() {
      const notes = await appelerApi('notes.php');
      if (notes === null) return;

      const liste = document.getElementById('liste-notes');
      liste.innerHTML = '';
      notes.forEach(note => {
        const li = document.createElement('li');
        li.textContent = '#' + note.id + ' ' + note.texte;
        liste.appendChild(li);
      });
    }

    async function ajouterNote() {
      const texte = document.getElementById('champ-note').value;
      if (!texte) return;

      const resultat = await appelerApi('notes.php', {
        method: 'POST',
        body: JSON.stringify({ texte })
      });
      if (resultat === null) return;

      document.getElementById('champ-note').value = '';
      chargerNotes();
    }

    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const msgEl = document.getElementById('msg-register');

      try {
        const res = await fetch(`${API}/register.php`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        msgEl.style.color = res.ok ? 'green' : 'red';
        msgEl.textContent = res.ok ? data.message : data.erreur;
      } catch (err) {
        msgEl.style.color = 'red';
        msgEl.textContent = 'Erreur réseau';
      }
    });

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const msgEl = document.getElementById('msg-login');

      try {
        const res = await fetch(`${API}/login.php`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          msgEl.style.color = 'green';
          msgEl.textContent = 'Connecté : ' + email;
          chargerNotes();
        } else {
          msgEl.style.color = 'red';
          msgEl.textContent = data.erreur;
        }
      } catch (err) {
        msgEl.style.color = 'red';
        msgEl.textContent = 'Erreur réseau';
      }
    });
    chargerNotes();
  </script>
</body>

</html>
